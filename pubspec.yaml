name: hanj
description: "Hanj — track the anime that pulls you forward."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  provider: ^6.1.5+1
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1
  http: ^1.6.0
  shimmer: ^3.0.0
  fl_chart: ^1.2.0
  intl: ^0.20.2
  flutter_staggered_animations: ^1.1.1
  firebase_messaging: 16.2.0
  google_sign_in: ^7.2.0
  connectivity_plus: ^6.0.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0
  youtube_player_flutter: ^9.1.3
  path_provider: ^2.1.4
  gal: ^2.3.0
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.2.0
  share_plus: ^10.0.0
  cloud_functions: ^6.2.0
  speech_to_text: any
  flutter_tts: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/hanj_wing.png
    - assets/images/hanj_wing_transparent.png
    - assets/images/hanj_wing_transparent_hires.png


# ─────────────────────────────────────────────────────────────────────────────
# App icon — run: flutter pub run flutter_launcher_icons
# ─────────────────────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  remove_alpha_ios: true

# ─────────────────────────────────────────────────────────────────────────────
# Native splash (cold start, before Flutter takes over)
# Run: flutter pub run flutter_native_splash:create
# ─────────────────────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#0D0B09"
  android_12:
    color: "#0D0B09"
