  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #121110;
          background-size: 100% 100%;
    }

    .center {

      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

      bottom: 0;

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

  <!-- ── Loading shell ──────────────────────────────────────────────────────
       Paints before Flutter boots. A cold visit downloads ~4 MB (app +
       CanvasKit) before the first Flutter frame, and without this the whole
       wait is a bare #121110 screen that reads as a broken link.

       Deliberately self-contained: no webfont (fetching one would add to the
       very wait this is covering, so the wordmark is drawn as inline outlines),
       no image request, no external CSS. Everything here is inline and paints
       on the first pass.

       The background is #121110 (sumi) — the same colour Flutter paints first in
       AuthWrapper's waiting branch — so the handover has no flash. -->
  <style id="hanj-splash-style">
    #hanj-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #121110;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 300ms ease;
    }
    #hanj-splash.hanj-splash--hide {
      opacity: 0;
      pointer-events: none;
    }
    .hanj-splash__inner {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hanj-splash__mark {
      width: 54px;
      height: 54px;
      display: block;
    }
    .hanj-splash__word {
      margin-top: 14px;
      /* "Hanj" in Shippori Mincho 600 (stage H2), as inline outlines taken
         from the app's bundled Latin cut, so the shell shows the wordmark's
         own letters before any font can load. Still never a webfont here:
         a path paints on the first pass. One em of the font is 34px, the
         size the Georgia stand-in had, tracked -0.5px as it was. */
      display: block;
      font-size: 34px;
      height: 1em;
      width: auto;
      fill: #EEE7DA;
    }
    .hanj-splash__bar {
      position: relative;
      margin-top: 26px;
      width: 132px;
      height: 2px;
      border-radius: 2px;
      background: rgba(243, 238, 231, 0.12);
      overflow: hidden;
    }
    .hanj-splash__bar span {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      border-radius: 2px;
      background: #E8624A;
      /* linear, not ease-in-out: an eased sweep lingers at both extremes,
         where the segment is mostly off-track, so the indicator reads as
         stalled for a noticeable slice of every cycle. Caught this by looking
         at a capture mid-load. */
      animation: hanj-splash-slide 1.15s linear infinite;
    }
    @keyframes hanj-splash-slide {
      0%   { left: -40%; }
      100% { left: 100%; }
    }
    /* Honour a reduced-motion preference: keep the indicator, drop the sweep. */
    @media (prefers-reduced-motion: reduce) {
      .hanj-splash__bar span {
        animation: none;
        left: 0;
        width: 100%;
        opacity: 0.6;
      }
      #hanj-splash { transition: none; }
    }
  </style>

  <script id="hanj-splash-script">
    // Hand over on Flutter's own first-frame event, which main.dart.js
    // dispatches once the first frame is rasterised.
    //
    // No timeout fallback on purpose. A timer that removed this early would
    // reintroduce exactly the problem it exists to solve — a blank screen on a
    // slow connection, which is the case that most needs covering. If Flutter
    // never boots, a stuck loading state is more honest than an empty page.
    (function () {
      var splash = document.getElementById('hanj-splash');
      if (!splash) return;
      window.addEventListener('flutter-first-frame', function () {
        splash.classList.add('hanj-splash--hide');
        window.setTimeout(function () { splash.remove(); }, 320);
      }, { once: true });
    })();
  </script>
